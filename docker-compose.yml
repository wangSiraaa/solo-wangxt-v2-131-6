services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: powerquality
      POSTGRES_USER: pq
      POSTGRES_PASSWORD: pq-password
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pq -d powerquality"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    env_file: ./backend/.env.example
    environment:
      PQ_DATABASE_URL: postgresql+psycopg://pq:pq-password@postgres:5432/powerquality
      PQ_REDIS_URL: redis://redis:6379/0
      PQ_MINIO_ENDPOINT: minio:9000
      PQ_OBJECT_STORE: minio
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build: ./backend
    env_file: ./backend/.env.example
    environment:
      PQ_DATABASE_URL: postgresql+psycopg://pq:pq-password@postgres:5432/powerquality
      PQ_REDIS_URL: redis://redis:6379/0
      PQ_MINIO_ENDPOINT: minio:9000
      PQ_OBJECT_STORE: minio
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    command: celery -A app.celery_app.celery_app worker --loglevel=INFO --concurrency=2

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev"
    ports: ["5173:5173"]

volumes:
  pgdata:
  minio:
